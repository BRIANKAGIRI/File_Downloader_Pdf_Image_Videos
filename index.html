<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <title>File Downloader in JavaScript</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="wrapper">
        <header>
            <h1>File Downloader</h1>
            <p>Paste a direct URL to an image, video, PDF, or other file. This tool was created by Brian Kagiri</p>
        </header>

        <form id="downloadForm">
            <input
                type="url"
                id="fileUrl"
                placeholder="Paste direct file URL"
                required
            >

            <button type="submit" id="downloadBtn">
                Download File
            </button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
